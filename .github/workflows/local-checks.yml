name: Local checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Local contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and run local contracts
        env:
          REPORT_MAIL_ENABLED: ${{ secrets.REPORT_MAIL_ENABLED }}
          REPORT_MAIL_USERNAME: ${{ secrets.REPORT_MAIL_USERNAME }}
          REPORT_MAIL_PASSWORD: ${{ secrets.REPORT_MAIL_PASSWORD }}
          REPORT_MAIL_TO: ${{ vars.REPORT_MAIL_TO }}
        run: >-
          mvn --batch-mode --no-transfer-progress -Pci
          "-Dallure.run.id=${{ github.run_id }}-${{ github.run_attempt }}-${{ runner.os }}"
          verify
      - name: Retain test reports even on failure
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: local-checks-${{ runner.os }}-${{ github.run_attempt }}
          path: target/ci/
          if-no-files-found: warn
          retention-days: 7

# شرح الملف: يحدد أين وكيف يحفظ سجل ما حدث أثناء التشغيل.
############################
#       LOGGING CONFIG     #
############################
# Log files location
property.basePath=test-outputs/Logs
appender=file, stdout
############################
#       FILE APPENDER      #
############################
appender.file.type=File
appender.file.name=fileAppender
appender.file.fileName=${basePath}/log_${date:yyyy-MM-dd_HH-mm-ss}.log
appender.file.layout.type=PatternLayout
appender.file.layout.pattern=[%level] %d{yyyy-MM-dd HH:mm:ss.SSS} [%-20.20t] [%-35.35c{1}] - %msg%n%throwable
############################
#     CONSOLE APPENDER     #
############################
appender.stdout.type=Console
appender.stdout.name=consoleAppender
appender.stdout.layout.type=PatternLayout
appender.stdout.layout.disableAnsi=false
appender.stdout.layout.noConsoleNoAnsi=false
appender.stdout.layout.pattern=%style{%d{HH:mm:ss.SSS}}{bright,black} %highlight{%-5level}{FATAL=bg_red, ERROR=red, WARN=yellow, INFO=green, DEBUG=cyan, TRACE=blue} %style{[%t]}{magenta} %style{%-30.30logger{1}}{blue} - %msg%n%throwable
############################
#        ROOT LOGGER       #
############################
rootLogger.level=Trace
rootLogger.appenderRef.file.ref=fileAppender
rootLogger.appenderRef.stdout.ref=consoleAppender
